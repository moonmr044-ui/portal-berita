# File: docker/prod/nginx.conf
# Nginx produksi: melayani PHP-FPM via unix socket, hanya port 8080 (di belakang reverse proxy TLS).
user appuser;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /dev/stdout main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;
    client_max_body_size 8m;

    # Cache direktori statis
    open_file_cache max=10000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/rss+xml application/atom+xml image/svg+xml
        application/vnd.ms-fontobject font/ttf font/otf font/woff font/woff2;

    # Zona rate-limit dasar (aplikasi punya limiter sendiri; ini lapisan kedua)
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

    upstream php-fpm {
        server unix:/tmp/php-fpm.sock;
    }

    server {
        listen 8080;
        server_name _;
        root /var/www/html/public;
        index index.php;

        charset utf-8;

        # Healthcheck internal
        location = /up {
            access_log off;
            try_files $uri /index.php?$query_string;
        }

        # Aset Vite ber-hash: immutable
        location ^~ /build/ {
            access_log off;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Media publik terabstraksi
        location ^~ /storage/ {
            access_log off;
            expires 30d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|ttf|otf|eot|map)$ {
            access_log off;
            expires 30d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        # robots/sitemap/rss: dilayani aplikasi, tanpa rate-limit ketat
        location ~ ^/(robots\.txt|sitemap.*\.xml|rss.*)$ {
            try_files $uri /index.php?$query_string;
        }

        location / {
            limit_req zone=general burst=60 nodelay;
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass php-fpm;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_param HTTPS $https if_not_empty;
            fastcgi_read_timeout 60s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
            fastcgi_hide_header X-Powered-By;
        }

        # Header keamanan (juga dipasang middleware aplikasi; ini jaring terakhir)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location ~ /\.(?!well-known).* {
            deny all;
        }

        location ~ /\.env {
            deny all;
        }
    }
}
