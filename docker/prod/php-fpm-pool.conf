; File: docker/prod/php-fpm-pool.conf
; Pool php-fpm produksi: unix socket di /tmp (dapat ditulis user non-root), static pool sesuai CPU.
[www]
user = appuser
group = appuser

listen = /tmp/php-fpm.sock
listen.owner = appuser
listen.group = appuser
listen.mode = 0660
listen.backlog = 511

pm = static
pm.max_children = 16
pm.max_requests = 500

request_terminate_timeout = 60s
request_slowlog_timeout = 5s
slowlog = /dev/stderr

catch_workers_output = yes
decorate_workers_output = no

php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on
php_admin_value[expose_php] = Off

; Variabel lingkungan penting tersedia untuk PHP
clear_env = no

; Timezone
php_admin_value[date.timezone] = UTC
