# File: docker-compose.prod.yml
# Stack produksi: tanpa mailpit, tanpa dev tooling, APP_DEBUG=false, secret via file.
# Pemakaian:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
# Rahasia wajib disediakan lewat:
#   - file .env.production (chmod 600, TIDAK masuk git), dan/atau
#   - Docker secret / *_FILE env (APP_KEY_FILE, DB_PASSWORD_FILE)

x-app: &app
  image: '${APP_IMAGE:-portal-berita:latest}'
  build:
    context: '.'
    dockerfile: Dockerfile.prod
  restart: unless-stopped
  networks:
    - portal
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment:
    APP_ENV: production
    APP_DEBUG: 'false'
    APP_KEY: '${APP_KEY}'
    APP_URL: '${APP_URL}'
    APP_TIMEZONE: UTC
    APP_LOCALE: id
    APP_FALLBACK_LOCALE: id
    LOG_CHANNEL: stack
    LOG_LEVEL: warning
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: '3306'
    DB_DATABASE: '${DB_DATABASE}'
    DB_USERNAME: '${DB_USERNAME}'
    DB_PASSWORD: '${DB_PASSWORD}'
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    REDIS_PORT: '6379'
    REDIS_DB: '0'
    REDIS_CACHE_DB: '1'
    REDIS_QUEUE_DB: '2'
    REDIS_SESSION_DB: '3'
    REDIS_VIEWS_DB: '4'
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: redis
    SESSION_SECURE_COOKIE: 'true'
    FILESYSTEM_DISK: public
    MAIL_MAILER: '${MAIL_MAILER:-smtp}'
    MAIL_HOST: '${MAIL_HOST}'
    MAIL_PORT: '${MAIL_PORT:-587}'
    MAIL_USERNAME: '${MAIL_USERNAME}'
    MAIL_PASSWORD: '${MAIL_PASSWORD}'
    MAIL_ENCRYPTION: '${MAIL_ENCRYPTION:-tls}'
    SEARCH_DRIVER: '${SEARCH_DRIVER:-database}'
    MEILISEARCH_HOST: 'http://meilisearch:7700'
    MEILISEARCH_KEY: '${MEILISEARCH_KEY}'
    TELESCOPE_ENABLED: 'false'
    PULSE_ENABLED: 'true'
  volumes:
    - 'storage-app:/var/www/html/storage/app'
    - 'storage-logs:/var/www/html/storage/logs'
    - 'storage-backups:/var/www/html/storage/backups'

services:
  app:
    <<: *app
    ports:
      - '${APP_PORT:-8080}:8080'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/up']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s

  horizon:
    <<: *app
    command: php artisan horizon
    ports: []
    healthcheck:
      disable: true

  scheduler:
    <<: *app
    command: php artisan schedule:work
    ports: []
    healthcheck:
      disable: true

  mysql:
    image: 'mysql:8.4'
    restart: unless-stopped
    command:
      - '--character-set-server=utf8mb4'
      - '--collation-server=utf8mb4_unicode_ci'
      - '--innodb-flush-log-at-trx-commit=2'
      - '--max-connections=300'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD}'
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
      TZ: UTC
    volumes:
      - 'mysql-data:/var/lib/mysql'
    networks:
      - portal
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-p${DB_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: 'redis:7-alpine'
    restart: unless-stopped
    command:
      - 'redis-server'
      - '--appendonly'
      - 'yes'
      - '--maxmemory'
      - '512mb'
      - '--maxmemory-policy'
      - 'allkeys-lru'
      - '--requirepass'
      - '${REDIS_PASSWORD}'
    volumes:
      - 'redis-data:/data'
    networks:
      - portal
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: 'getmeili/meilisearch:v1.11'
    restart: unless-stopped
    profiles: ['search']
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: '${MEILISEARCH_KEY}'
      MEILI_NO_ANALYTICS: 'true'
    volumes:
      - 'meilisearch-data:/meili_data'
    networks:
      - portal

  # Reverse proxy TLS opsional (aktifkan profil "proxy")
  proxy:
    image: 'nginx:1.27-alpine'
    restart: unless-stopped
    profiles: ['proxy']
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - './docker/prod/reverse-proxy.conf:/etc/nginx/conf.d/default.conf:ro'
      - './storage/certs:/etc/nginx/certs:ro'
    depends_on:
      - app
    networks:
      - portal

networks:
  portal:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  meilisearch-data:
    driver: local
  storage-app:
    driver: local
  storage-logs:
    driver: local
  storage-backups:
    driver: local
